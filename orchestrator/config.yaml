# Background orchestrator config, parsed by lib/config.py (zero dependencies).
#
# FORMAT: a small hand-rolled YAML subset. Exactly two shapes exist:
#   key: value          # top-level scalar
#   section:            # a top-level key with no value opens a list of flat mappings
#     - key: value
#       key: value
# No deeper nesting, no quoting, no multi-line values. Multi-value fields
# (like a project's `dirs`) use YAML flow style: [one, two]. The older
# space-separated form still parses. Comments and blank lines are ignored.
#
# LAYERING: every top-level scalar acts as a shared default for all accounts;
# an account's own keys override it. So write shared knobs (regime hours,
# slices, rate estimates) once here, and per-subscription calibration inside
# each `accounts` entry.
#
# BACKWARD COMPATIBILITY: if the `accounts` and `projects` sections are absent
# (the legacy flat format), one account named "default" is synthesized from the
# flat keys (profile ~/.claude) plus one project named "default" whose dirs
# come from the legacy `extra_dirs` key. Tasks without a `project:` frontmatter
# key route to the project named "default" when one exists, so old configs and
# old task files keep working unchanged.
#
# All *_tokens figures are in ccusage-estimated token units.
# IMPORTANT: the token numbers below are EXAMPLE calibration values from real
# Max accounts. Calibrate your own: compare /usage percentages against
# `npx ccusage blocks --json` totals over a few days, then scale.
dry_run: false
# Night regime hours (local time).
night_start: 02:00
night_end: 06:00
morning_guard: 08:30
# When the daily digest job runs (local time). Also the boundary a run's
# journal entry uses to pick its digest day: strictly before this time, a
# finishing run journals into TODAY's digest file; at or after, TOMORROW's
# (today's digest has already been curated by then).
digest_time: 07:37
# Pre-reset burn-down starts this many hours before the reset. Also sets what
# the last night can absorb (ceil(hours / 5) quota windows), which is what the
# per-night plan hoards for it.
prereset_burn_hours: 8
# Activity lock threshold (minutes since the last interactive session write on
# the account being scheduled; each account has its own idle clock).
activity_idle_night_min: 40
# Slice size (wall-clock minutes handed to the claude session).
night_slice_min: 50
# Session slots. The count is decided by the budget alone; this is a SAFETY
# ceiling for the machine, not a pacing tool (8 max: run.sh allocates
# RUNNING.1..8). Start conservative, read the `estimate` and `cost` lines of
# `gate.py status`, then raise it.
max_parallel_sessions: 4

# Shape of the per-night allocation of the weekly surplus. Night j of the n left
# before the reset gets weight r^(j-1), so the plan is back-loaded: unspent
# quota is worth less the closer the reset gets, and the last night is open bar.
# r = 1 degenerates to a flat split.
# Raise this cautiously: the share is (r-1)/(r^n - 1), which collapses fast. At
# r = 2 with 7 nights left the first night gets 1/127 of the pool - measured on
# a real backlog that was less than one median session, so most nights of the
# week could not fund a single session out of their own allocation.
night_budget_ratio: 1.0
# Cold-start estimate of what one session costs (ccusage token units), used
# until the ledger has measured a real figure for a (task, model) pair. Per
# session, not per minute: sessions do not fill their slice, so the slice
# length says nothing about the cost. Calibrate from `gate.py status`
# (`cost task=...`) once a few nights have run; a p75 of the measured
# distribution is a reasonable prior, the mean is dragged by a long tail.
est_session_tokens: 2500000
# Pre-reset polarization: the burn-down upgrades sessions to the strongest
# model the doomed surplus can justify (task `model:` is a floor, never a
# ceiling). Thresholds in ccusage token units, to calibrate from the ledger.
fable_min_surplus_tokens: 100000000
opus_min_surplus_tokens: 30000000
# Claude invocation defaults (an account may override claude_bin). Use an
# absolute path if claude is not on the PATH that run.sh exports (launchd
# hands down a bare one).
claude_bin: /usr/local/bin/claude
claude_model: sonnet
claude_effort: low
# Hard per-session cost ceiling (--max-budget-usd, enforced by the CLI even on
# a subscription). Runaway protection only, NOT a pacing tool: a budget kill is
# a hard stop with no clean shutdown (no resume point written). Keep it ~5x the
# observed max per-run cost from the ledger (example: median 0.60, max 3.00).
max_session_usd: 15

# --- Accounts ---------------------------------------------------------------
# One entry per Claude subscription. Each account is scheduled independently
# every tick: its own budget controller, its own activity lock (idle time is
# measured on THAT account's interactive transcripts), its own parallel-slot
# ceilings, and its own state files under state/<name>/ (cost ledger, locks).
# Two accounts can run sessions in the same tick without interfering.
#
# Per-account keys:
#   name              required, referenced by projects
#   claude_config_dir required, the Claude Code profile dir for this
#                     subscription (drives CLAUDE_CONFIG_DIR at launch AND
#                     where activity/usage are read)
#   claude_bin        optional, defaults to the shared top-level claude_bin
#   weekly_cap_tokens, window_cap_tokens, p90_daily_tokens
#                     quota calibration for this subscription
#   reset_weekday (0=Monday), reset_time, reset_tz
#                     this subscription's weekly reset (check /usage:
#                     "Resets <date> at <time>")
#   promo_multiplier, promo_until
#                     optional temporary quota multiplier; the multiplier
#                     applies only until promo_until (inclusive), then falls
#                     back to 1.0 automatically
accounts:
  - name: personal
    claude_config_dir: ~/.claude
    weekly_cap_tokens: 631000000
    window_cap_tokens: 94000000
    p90_daily_tokens: 85000000
    reset_weekday: 4
    reset_time: 05:59
    reset_tz: Europe/Warsaw
    promo_multiplier: 1.0
    promo_until: 2000-01-01
  - name: work
    claude_config_dir: ~/.claude-work
    claude_bin: /usr/local/bin/claude
    weekly_cap_tokens: 300000000
    window_cap_tokens: 60000000
    p90_daily_tokens: 40000000
    reset_weekday: 0
    reset_time: 09:00
    reset_tz: Europe/Warsaw

# --- Projects ---------------------------------------------------------------
# A project routes tasks to an account and declares where its sessions may
# write. The tool imposes no taxonomy: name projects however your life is
# organized. Task frontmatter says `project: <name>`; a task whose project
# does not exist (or references a missing account) is never scheduled.
#
# Per-project keys:
#   name               required, referenced by task frontmatter
#   account            required, the account this project's tasks run on
#   dirs               directories handed to the session via --add-dir,
#                      flow-style list [a, b], ~ expands to $HOME
#   priority           optional integer, LOWER is preferred (default 100);
#                      orders projects within an account before per-task rules
#   local_only_default optional; tasks in this project default to
#                      local_only: true (a task can still say local_only: false)
projects:
  - name: side-projects
    account: personal
    dirs: [~/projects]
    priority: 10
  - name: life
    account: personal
    dirs: [~/personal]
    priority: 50
    local_only_default: true
  - name: work
    account: work
    dirs: [~/work]
    priority: 10
    local_only_default: true
