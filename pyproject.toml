[tool.ruff]
target-version = "py314"
extend-exclude = ["examples"]

[tool.ruff.lint]
# Classic defaults (pycodestyle errors, pyflakes) plus bugbear.
select = ["E4", "E7", "E9", "F", "B"]
# E741: `l` is used for a line in short comprehensions across the engine and
# its tests; renaming it in ~25 places would be churn without a bug behind it.
ignore = ["E741"]
